name: OpenAPI schema sync

# Regenerates tools/ocsinventory-backend-api-references.yaml from the current
# DRF serializers/views (used by the GitBook doc to render the API reference)
# and opens a PR with the diff whenever it drifts from the code.
on:
  push:
    branches: [dev]
    paths-ignore:
      - 'tools/ocsinventory-backend-api-references.yaml'
  workflow_dispatch:

env:
  SECRET_KEY: ci-tests-not-a-real-secret
  DJANGO_SETTINGS_MODULE: ocsinventory_backend.settings_test

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate OpenAPI schema
        run: |
          python manage.py spectacular --file tools/ocsinventory-backend-api-references.yaml

      - name: Open PR if the schema changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(openapi): sync API reference schema with backend code'
          title: 'chore(openapi): sync API reference schema'
          body: |
            Auto-generated by the `OpenAPI schema sync` workflow after changes were
            pushed to `dev`: `tools/ocsinventory-backend-api-references.yaml` no
            longer matched the current DRF serializers/views.

            This file feeds the GitBook API reference doc — please review the diff
            before merging.
          branch: bot/openapi-schema-sync
          delete-branch: true
          add-paths: tools/ocsinventory-backend-api-references.yaml
          labels: documentation
