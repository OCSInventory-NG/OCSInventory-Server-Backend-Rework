name: Release

# Publishes a GitHub Release automatically for every version tag, with:
#  - a title/body (hand-written intro + GitHub's auto-generated notes)
#  - the source tarball asset that OCSInventory-Server-Packages' own release
#    pipeline downloads to build the .deb/.rpm/docker artifacts
#    (see https://github.com/OCSInventory-NG/OCSInventory-Server-Packages)
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  PKG: ocsinventory-backend

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release tarball
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="${PKG}/" HEAD | tar -x
          settings="${PKG}/ocsinventory_backend/settings.py"
          sed -i "s/^BACKEND_VERSION = .*/BACKEND_VERSION = \"${VERSION}\"/" "${settings}"
          grep -qxF "BACKEND_VERSION = \"${VERSION}\"" "${settings}"
          tar -czf "${PKG}-${VERSION}.tar.gz" "${PKG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "OCS Inventory Backend ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            OCS Inventory Backend ${{ github.ref_name }}.

            If you are upgrading from version 2.X, check our documentation to see what's changed and our migration guide:
            - https://documentation.ocsinventory-ng.org/project-overview/v2-vs-v3-whats-changed#architecture
            - https://documentation.ocsinventory-ng.org/project-overview/migration-guide
          files: "${{ env.PKG }}-${{ github.ref_name }}.tar.gz"
