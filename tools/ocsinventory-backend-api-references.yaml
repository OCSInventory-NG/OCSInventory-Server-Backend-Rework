components:
  schemas:
    AccountinfoConfig:
      type: object
      description: This serialize class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 512
        datatype:
          $ref: '#/components/schemas/DatatypeEnum'
        datatarget:
          allOf:
          - $ref: '#/components/schemas/DatatargetEnum'
          default: ASSET
        accountinfo_values:
          type: array
          items:
            type: integer
          readOnly: true
      required:
      - accountinfo_values
      - description
      - id
      - name
    AccountinfoData:
      type: object
      description: This serialize class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        accountdata:
          nullable: true
        object_slug:
          type: string
          nullable: true
          maxLength: 100
        content_type:
          type: integer
          readOnly: true
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - content_type
      - id
      - object_id
    AccountinfoValue:
      type: object
      description: This serialize class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        accountinfo_config:
          type: integer
        value:
          type: string
          maxLength: 100
      required:
      - accountinfo_config
      - id
      - value
    Action:
      type: object
      description: This serialize class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        rule:
          type: integer
          nullable: true
        priority:
          type: integer
        action:
          $ref: '#/components/schemas/ActionEnum'
        content_type:
          type: integer
          nullable: true
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        object_slug:
          type: string
          nullable: true
          maxLength: 100
        field:
          type: string
          maxLength: 255
        value: {}
      required:
      - action
      - field
      - id
      - value
    ActionEnum:
      enum:
      - set
      type: string
      description: '* `set` - Set'
    ApiCheckResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
