          type: string
          enum:
          - ASSET
          - IPDISCOVER
        description: |-
          * `ASSET` - Assets
          * `IPDISCOVER` - IPDiscover
      - in: query
        name: datatype
        schema:
          type: string
          enum:
          - CHECKBOX
          - SELECT
          - TEXT
          - TEXTAREA
        description: |-
          * `TEXT` - Text
          * `TEXTAREA` - Textarea
          * `SELECT` - Select
          * `CHECKBOX` - Checkbox
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - xml
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - accountinfo
      security:
      - knoxApiToken: []
