  /asset/logs/:
    get:
      operationId: asset_logs_list
      description: |-
        This class will define the view behavior

        Args:
            viewsets ([OCSVIewSet])
      parameters:
      - in: query
        name: asset
        schema:
          type: integer
      - in: query
        name: comment
        schema:
          type: string
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - xml
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - CONFIG_ERR
          - CONFIG_UPDATE
          - DEPLOYMENT_ACK
          - DEPLOYMENT_ERR
          - INVENTORY_BASE_ERR
          - INVENTORY_BASE_INSERT
          - INVENTORY_BASE_UPDATE
          - INVENTORY_EXT_ERR
          - INVENTORY_EXT_INSERT
          - INVENTORY_EXT_UPDATE
          - TEMPLATE_ERR
          - TEMPLATE_UPDATE
          - UNKNOWN
        description: |-
          * `INVENTORY_BASE_INSERT` - Inserting new items into the base inventory
          * `INVENTORY_BASE_UPDATE` - Updating existing items in the base inventory
          * `INVENTORY_EXT_INSERT` - Inserting new items into the extended inventory
          * `INVENTORY_EXT_UPDATE` - Updating existing items in the extended inventory
          * `INVENTORY_BASE_ERR` - Error related to the base inventory operations
