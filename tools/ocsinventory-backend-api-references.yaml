      - in: query
        name: retrieval_method
        schema:
          type: string
          enum:
          - BASH
          - CMD
          - FILE
          - PW
          - SNMP_GET
          - SNMP_WALK
        description: |-
          * `FILE` - Read file
          * `BASH` - Bash command
          * `PW` - Powershell command
          * `CMD` - Cmd command
          * `SNMP_WALK` - Walk the SNMP tree starting from a specific OID
          * `SNMP_GET` - Get a specific OID
      - in: query
        name: retrieval_output
        schema:
          type: string
          enum:
          - GREP
          - JSON
          - PTXT
          - REGX
          - TBLE
        description: |-
          * `PTXT` - Plain text
          * `JSON` - JSON format
          * `TBLE` - Table format
          * `REGX` - Regex processing
          * `GREP` - Grep command output
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target
        schema:
          type: string
      - in: query
