      - name
      - search
      - user
    SearchCondition:
      type: object
      description: |-
        One search condition, as sent in a search_data AND-group.

        Example:
        {"object": "software_dictionary_entries", "route": "software_dictionary",
         "field": "name", "fieldtype": "string", "operator": "iexact",
         "value": "Git", "link": "AND"}
      properties:
        object:
          type: string
          description: Target model key, e.g. 'InventoryBase', 'AccountinfoConfig',
            'results', 'logs', 'snmpscanner', 'inventory_sections', 'software_dictionary_entries'.
        route:
          type: string
          description: Frontend route associated with the condition.
        field:
          type: string
          description: Field name to filter on.
        fieldtype:
          type: string
          description: Field type hint, e.g. 'string', 'select', 'checkbox'.
        operator:
          type: string
          description: Lookup operator, e.g. 'exact', 'iexact', 'icontains', 'istartswith',
            'iendswith'.
        value:
          description: Value to compare the field against.
        link:
          allOf:
          - $ref: '#/components/schemas/LinkEnum'
          default: AND
          description: |-
            How this condition links to the previous one.

            * `AND` - AND
            * `OR` - OR
        section:
          type: string
          description: Template section id, required when object is 'inventory_sections'.
      required:
      - field
      - object
      - operator
      - value
    SearchError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    SearchRequest:
      type: object
      description: |-
        Payload accepted by POST /search/.

        search_data is a list of AND-groups; groups are combined using each
        group's first condition 'link' (AND/OR).
      properties:
        search_data:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/SearchCondition'
          description: List of AND-condition groups to combine into the search query.
        grouped:
          type: boolean
          default: true
          description: If true, results are grouped by asset with a single matched
            row per relation.
        ungroup:
          type: boolean
          default: false
          description: If true, one row is returned per matched related record instead
            of one per asset.
    Section:
      type: object
      description: This serialize class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        retrieval_method:
          $ref: '#/components/schemas/SectionRetrievalMethodEnum'
        retrieval_output:
          $ref: '#/components/schemas/RetrievalOutputEnum'
        target:
          type: string
        template:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        options:
          nullable: true
      required:
      - fields
      - id
      - name
      - target
    SectionRetrievalMethodEnum:
      enum:
      - FILE
      - BASH
      - PW
      - CMD
      - SNMP_WALK
      - SNMP_GET
      type: string
      description: |-
        * `FILE` - Read file
        * `BASH` - Bash command
        * `PW` - Powershell command
        * `CMD` - Cmd command
        * `SNMP_WALK` - Walk the SNMP tree starting from a specific OID
        * `SNMP_GET` - Get a specific OID
    ServerInfo:
      type: object
      properties:
        backend_version:
          type: string
          nullable: true
        authentication_type:
          type: array
          items:
            type: string
        infrastructure_type:
          type: string
          nullable: true
        operating_system:
          type: string
          nullable: true
        operating_system_version:
          type: string
          nullable: true
        db_engine:
          type: string
          nullable: true
        ocs_configuration: {}
        python_version:
          type: string
          nullable: true
        python_libs_version:
          type: object
          additionalProperties:
            type: string
            nullable: true
      required:
      - authentication_type
      - backend_version
      - db_engine
      - infrastructure_type
      - ocs_configuration
      - operating_system
      - operating_system_version
      - python_libs_version
      - python_version
    SeverityEnum:
      enum:
      - critical
      - high
      - medium
      - low
      type: string
      description: |-
        * `critical` - Critical
        * `high` - High
        * `medium` - Medium
        * `low` - Low
    SnmpConfig:
      type: object
      description: This serializer class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
        version:
          $ref: '#/components/schemas/VersionEnum'
        user:
          type: string
          nullable: true
          maxLength: 128
        auth_level:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AuthLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        password:
          type: string
          nullable: true
          maxLength: 128
        auth_protocol:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AuthProtocolEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        priv_protocol:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PrivProtocolEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        priv_password:
          type: string
          nullable: true
          maxLength: 128
        retries:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        timeout:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        subnets: {}
      required:
      - id
      - name
      - subnets
      - version
    SnmpScanner:
      type: object
      description: This serializer class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        ip:
          type: string
        subnets: {}
        notes:
          type: string
          nullable: true
        last_updated:
          type: string
          format: date-time
          readOnly: true
        total_scanned:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        total_found:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        last_scan_date:
          type: string
          format: date-time
          nullable: true
        configs:
          type: array
          items:
            type: integer
        assets:
          type: array
          items:
            type: integer
      required:
      - id
      - ip
      - last_updated
      - name
    SoftwareDictionary:
      type: object
      description: Serialize aggregated asset/software relationships
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          nullable: true
        publisher:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
          maxLength: 128
        major_version:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        minor_version:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        patch_version:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        assets:
          type: array
          items:
            type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        installation_number:
          type: integer
          readOnly: true
      required:
      - assets
      - id
      - installation_number
      - updated_at
    SoftwareMapping:
      type: object
      description: |-
        Mixin to dynamically expand nested fields based on the "expand" query parameter.

        To use, add an `expandable_fields` dictionary in your serializer's Meta:

            expandable_fields = {
                "some_relation": SomeNestedSerializer,
                "other_relation": OtherNestedSerializer,
            }

        The mixin will:
          - Expand all fields and childs if expand="*"
          - Expand fields provided in a comma separated list (expand=field1,field2)
          - or return the pks for the relation
      properties:
        id:
          type: integer
          readOnly: true
        template:
          type: integer
        section:
          type: integer
        name:
          type: integer
          nullable: true
        publisher:
          type: integer
          nullable: true
        version:
          type: integer
          nullable: true
        major_version:
          type: integer
          nullable: true
        minor_version:
          type: integer
          nullable: true
        patch_version:
          type: integer
          nullable: true
      required:
      - id
      - section
      - template
    TargetOsEnum:
      enum:
      - WIN
      - LIN
      - MAC
      type: string
      description: |-
        * `WIN` - Windows
        * `LIN` - Linux
        * `MAC` - Mac
    Template:
      type: object
      description: This serialize class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        os:
          $ref: '#/components/schemas/OsEnum'
        is_protected:
          type: boolean
        last_update:
          type: string
          format: date-time
          readOnly: true
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
      required:
      - id
      - last_update
      - name
      - sections
    Trigger:
      type: object
      properties:
        trigger:
          type: string
        model_name:
          type: string
        action_targets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        context_fields:
          type: string
          readOnly: true
      required:
      - action_targets
      - context_fields
      - model_name
      - trigger
    TriggerEnum:
      enum:
      - inventory_received
      - user_login
      - netdevice_received
      type: string
      description: |-
        * `inventory_received` - Inventory Received
        * `user_login` - User Login
        * `netdevice_received` - Netdevice Received
    User:
      type: object
      description: This serialize class provide the API representation
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        group_assignments:
          type: string
          readOnly: true
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - group_assignments
      - id
      - password
      - username
    VersionEnum:
      enum:
      - '1'
      - 2c
      - '3'
      type: string
      description: |-
        * `1` - SNMPv1
        * `2c` - SNMPv2c
        * `3` - SNMPv3
    VisibilityEnum:
      enum:
      - public
      - private_personal
      - private_group
      type: string
      description: |-
        * `public` - Public
        * `private_personal` - Private (Personal)
        * `private_group` - Private (Group)
    WindowsBuildMapping:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        build:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Windows build number (e.g. 22621)
        channel:
          type: string
          description: endoflife.date channel slug (e.g. 22h2)
          maxLength: 20
      required:
      - build
      - channel
      - id
  securitySchemes:
    knoxApiToken:
      type: apiKey
      in: header
