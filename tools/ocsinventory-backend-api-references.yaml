        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountinfoConfigList'
            application/xml:
              schema:
                $ref: '#/components/schemas/PaginatedAccountinfoConfigList'
          description: ''
    post:
